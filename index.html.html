<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发送广播通知</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
    }
    .card { background: white; width: 100%; max-width: 440px; padding: 28px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    h2 { font-size: 20px; color: #1e293b; text-align: center; margin-bottom: 12px; }
    #status { text-align: center; font-size: 13px; font-weight: 500; margin-bottom: 20px; }
    label { font-size: 14px; font-weight: 600; color: #475569; display: block; margin-bottom: 6px; }
    .input-box {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; margin-bottom: 16px;
    }
    .input-box:focus { border-color: #3b82f6; }
    textarea.input-box { height: 95px; resize: none; margin-bottom: 16px; }
    .btn-send {
      width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-send:hover { background: #1d4ed8; }

    /* 状态反馈 */
    .delivery-result {
      margin-top: 18px; padding: 12px; border-radius: 8px; font-size: 13px; text-align: center; font-weight: 500; display: none;
    }
    .waiting { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; display: block; }
    .success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; display: block; }
    .warning { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; display: block; }
    .failed { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📢 发送广播通知</h2>
    <div id="status" style="color: #eab308;">● 正在连接服务器...</div>

    <label>暗号：</label>
    <input type="text" id="targetTopic" class="input-box" placeholder="例如: class-1" onchange="onTopicChange()" />

    <label>通知内容：</label>
    <textarea id="msgContent" class="input-box" placeholder="例如：请小王拿着数学卷子来办公室"></textarea>

    <button class="btn-send" onclick="sendMsg()">立即发送</button>

    <div id="deliveryBox" class="delivery-result"></div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const targetTopic = document.getElementById("targetTopic");
    const msgContent = document.getElementById("msgContent");
    const deliveryBox = document.getElementById("deliveryBox");

    targetTopic.value = localStorage.getItem("last_used_topic") || "school/grade7/class1";

    let isConnected = false;
    let pendingMsgId = null;
    let ackTimeoutTimer = null;
    let client = null;

    function initClient() {
      client = new Paho.MQTT.Client(
        "broker.emqx.io", 
        8084, 
        "office_sender_" + Math.random().toString(16).substr(2, 8)
      );

      client.onConnectionLost = () => {
        statusEl.innerHTML = "● 连接已断开，正在重连...";
        statusEl.style.color = "#ef4444";
        isConnected = false;
        setTimeout(connect, 3000);
      };

      client.onMessageArrived = (message) => {
        try {
          const res = JSON.parse(message.payloadString);
          if (res.ackId && res.ackId === pendingMsgId) {
            clearTimeout(ackTimeoutTimer);
            pendingMsgId = null;

            if (res.status === "spoken") {
              // 正常播报
              deliveryBox.className = "delivery-result success";
              deliveryBox.innerHTML = `✅ 教室已成功接收并朗读 (${res.time})`;
            } else if (res.status === "silent") {
              // 页面在线但声音处于关闭状态
              deliveryBox.className = "delivery-result warning";
              deliveryBox.innerHTML = `⚠️ 教室已展示文字，但声音提醒处于【关闭】状态 (${res.time})`;
            }
          }
        } catch(e) {}
      };

      connect();
    }

    function connect() {
      client.connect({
        useSSL: true,
        onSuccess: () => {
          statusEl.innerHTML = "● 服务已就绪，随时可发送";
          statusEl.style.color = "#10b981";
          isConnected = true;
          subscribeCurrentAck();
        },
        onFailure: () => {
          statusEl.innerHTML = "● 连接失败，正在重试...";
          statusEl.style.color = "#ef4444";
          setTimeout(connect, 5000);
        }
      });
    }

    function subscribeCurrentAck() {
      const topic = targetTopic.value.trim();
      if (client && client.isConnected() && topic) {
        client.subscribe(topic + "/ack");
      }
    }

    function onTopicChange() {
      localStorage.setItem("last_used_topic", targetTopic.value.trim());
      subscribeCurrentAck();
    }

    function sendMsg() {
      const topic = targetTopic.value.trim();
      const text = msgContent.value.trim();

      if (!isConnected) {
        alert("服务器正在连接中，请稍后！");
        return;
      }
      if (!topic || !text) {
        alert("暗号和内容均不能为空！");
        return;
      }

      localStorage.setItem("last_used_topic", topic);
      subscribeCurrentAck();

      pendingMsgId = "msg_" + Date.now();
      const payload = JSON.stringify({ id: pendingMsgId, text: text });
      const msg = new Paho.MQTT.Message(payload);
      msg.destinationName = topic;
      client.send(msg);

      deliveryBox.className = "delivery-result waiting";
      deliveryBox.innerHTML = "📡 消息已发出，等待教室确认...";

      clearTimeout(ackTimeoutTimer);
      ackTimeoutTimer = setTimeout(() => {
        if (pendingMsgId) {
          deliveryBox.className = "delivery-result failed";
          deliveryBox.innerHTML = "⚠️ 未收到回执，教室可能未开机或网页未打开";
          pendingMsgId = null;
        }
      }, 4000);

      msgContent.value = "";
    }

    initClient();
  </script>
</body>
</html>
